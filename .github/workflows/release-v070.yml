name: Clara v0.7.0 Release Validation

on:
  push:
    branches:
      - release/0.7.0
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clara-v070-release
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/0.7.0
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Integrate v0.7.0 into monolith entrypoints
        run: node scripts/integrate-v070.mjs

      - name: Install dependencies
        run: npm run install:all

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit validated integration
        shell: bash
        run: |
          if ! git diff --quiet -- client/src/main.tsx server/src/index.ts server/src/v070.ts; then
            git config user.name "Clara Release Bot"
            git config user.email "clara-release@users.noreply.github.com"
            git add client/src/main.tsx server/src/index.ts server/src/v070.ts
            git commit -m "feat: integrate Clara v0.7.0"
            git push origin HEAD:release/0.7.0
          else
            echo "Release integration already applied."
          fi
