name: Clara v0.8.3 Release Validation

on:
  push:
    branches:
      - release/0.8.3
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clara-v083-release
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/0.8.3
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply v0.8.3 patch
        run: node scripts/patch-v083.mjs

      - name: Install dependencies
        run: npm run install:all

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: npm run typecheck > TYPECHECK-v0.8.3.log 2>&1

      - name: Save diagnostics on failure
        if: steps.typecheck.outcome == 'failure'
        shell: bash
        run: |
          git config user.name "Clara Release Bot"
          git config user.email "clara-release@users.noreply.github.com"
          git add -f TYPECHECK-v0.8.3.log
          git commit -m "chore: capture v0.8.3 typecheck diagnostics [skip ci]"
          git push origin HEAD:release/0.8.3
          exit 1

      - name: Production build
        run: npm run build

      - name: Commit validated patch
        shell: bash
        run: |
          rm -f TYPECHECK-v0.8.3.log
          if ! git diff --quiet; then
            git config user.name "Clara Release Bot"
            git config user.email "clara-release@users.noreply.github.com"
            git add package.json client/package.json server/package.json client/package-lock.json server/package-lock.json
            git add client/src/main.tsx server/src/index.ts server/src/v080.ts server/src/v083.ts
            git commit -m "feat: card invoice settlement and batch reconciliation in v0.8.3"
            git push origin HEAD:release/0.8.3
          else
            echo "Patch already applied."
          fi
