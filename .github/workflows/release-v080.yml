name: Clara v0.8.0 Release Validation

on:
  push:
    branches:
      - release/0.8.0
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clara-v080-release
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/0.8.0
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Integrate v0.8.0
        run: node scripts/integrate-v080.mjs

      - name: Install dependencies
        run: npm run install:all

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck diagnostics
        if: failure()
        shell: bash
        run: |
          nl -ba server/src/v080.ts | sed -n '82,108p'
          echo '--- TypeScript direct parse ---'
          npm --prefix server exec -- tsc -p tsconfig.json --noEmit --pretty false || true

      - name: Production build
        run: npm run build

      - name: Commit validated integration
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "Clara Release Bot"
            git config user.email "clara-release@users.noreply.github.com"
            git add client/src/main.tsx client/src/v070.tsx server/src/index.ts server/src/v080.ts package.json client/package.json server/package.json
            git add client/package-lock.json server/package-lock.json 2>/dev/null || true
            git commit -m "feat: integrate Clara v0.8.0 financial workflow"
            git push origin HEAD:release/0.8.0
          else
            echo "Release integration already committed."
          fi
