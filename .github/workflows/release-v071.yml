name: Clara v0.7.1 Release Validation

on:
  push:
    branches:
      - release/0.7.1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clara-v071-release
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/0.7.1
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Integrate v0.7.1
        run: node scripts/integrate-v071.mjs

      - name: Install dependencies
        run: npm run install:all

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit validated integration
        shell: bash
        run: |
          if ! git diff --quiet -- client/src/v070.tsx client/src/main.tsx server/src/index.ts client/package-lock.json server/package-lock.json; then
            git config user.name "Clara Release Bot"
            git config user.email "clara-release@users.noreply.github.com"
            git add client/src/v070.tsx client/src/main.tsx server/src/index.ts
            git add client/package-lock.json server/package-lock.json 2>/dev/null || true
            git commit -m "feat: add file orchestration in Clara v0.7.1"
            git push origin HEAD:release/0.7.1
          else
            echo "Release integration already committed."
          fi
